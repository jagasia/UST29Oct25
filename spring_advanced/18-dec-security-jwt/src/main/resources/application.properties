spring.application.name=15-dec-security-jpa

server.port=5000

spring.main.allow-circular-references=true

#spring.datasource.url=jdbc:h2:mem:customerdb
spring.datasource.url=jdbc:h2:file:./data/sampledata
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.path=/h2

jwt.secret=abcdefghijklmnopqrstuvwxyzthis-is-a-very-long-secret-key-at-least-32-bytes!
jwt.expiration-ms=1000*60*5

